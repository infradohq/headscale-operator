---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.20.1
  name: headscales.headscale.infrado.cloud
spec:
  group: headscale.infrado.cloud
  names:
    kind: Headscale
    listKind: HeadscaleList
    plural: headscales
    shortNames:
    - hs
    singular: headscale
  scope: Namespaced
  versions:
  - name: v1beta1
    schema:
      openAPIV3Schema:
        description: Headscale is the Schema for the headscales API
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: spec defines the desired state of Headscale
            properties:
              acl_policy:
                description: |-
                  ACLPolicy is the base ACL policy and tag ownership map. The operator
                  merges this with any HeadscaleAutoApprover resources that reference this
                  Headscale and pushes the result via the gRPC SetPolicy API.
                  Requires `spec.config.policy.mode=database`.
                properties:
                  inline:
                    description: |-
                      Inline is a JSON or HuJSON Headscale policy document that serves as the
                      base policy. The operator parses it, merges TagOwners and any
                      HeadscaleAutoApprover entries on top, then pushes the result via
                      the gRPC API. Use this for `acls`, `groups`, `hosts`, and `ssh` rules.
                    type: string
                  tag_owners:
                    additionalProperties:
                      items:
                        type: string
                      type: array
                    description: |-
                      TagOwners maps tag names to the list of users or groups that may apply
                      that tag (e.g. {"tag:router": ["group:admin"]}). Tags referenced by
                      HeadscaleAutoApprover resources must be declared here.
                    type: object
                type: object
              api_key:
                description: APIKey configuration for automatic API key management
                properties:
                  auto_manage:
                    default: true
                    description: AutoManage enables automatic API key creation and
                      rotation
                    type: boolean
                  expiration:
                    default: 2160h
                    description: |-
                      Expiration is the API key expiration duration in Go duration format (e.g., "2160h", "90d" is not valid, use "2160h" for 90 days)
                      The API key will be rotated before it expires
                      Examples: "720h" (30 days), "2160h" (90 days), "8760h" (365 days)
                    pattern: ^([0-9]+(\.[0-9]+)?(s|m|h))+$
                    type: string
                  manager_image:
                    default: ghcr.io/infradohq/headscale-operator/apikey-manager:latest
                    description: ManagerImage is the container image to use for the
                      API key manager sidecar
                    type: string
                  rotation_buffer:
                    default: 1920h
                    description: |-
                      RotationBuffer is the time before expiration to rotate the key in Go duration format (e.g., "168h" for 7 days)
                      Key will be rotated when it has less than this time remaining
                      Examples: "168h" (7 days), "1920h" (80 days)
                    pattern: ^([0-9]+(\.[0-9]+)?(s|m|h))+$
                    type: string
                  secret_name:
                    description: |-
                      SecretName is the name of the Kubernetes secret to store the API key.
                      When empty, the operator defaults to "<headscale-name>-api-key" so that
                      multiple Headscale instances in the same namespace do not collide.
                    pattern: ^[a-z0-9]([-a-z0-9]*[a-z0-9])?$
                    type: string
                type: object
              config:
                description: Config holds custom configuration for Headscale.
                properties:
                  acme_email:
                    description: ACMEEmail is the email for ACME registration
                    type: string
                  acme_url:
                    default: https://acme-v02.api.letsencrypt.org/directory
                    description: ACMEURL is the ACME directory URL
                    type: string
                  database:
                    description: Database configuration
                    properties:
                      debug:
                        default: false
                        description: Debug enables debug mode
                        type: boolean
                      gorm:
                        description: Gorm configuration
                        properties:
                          parameterized_queries:
                            default: true
                            description: ParameterizedQueries enables parameterized
                              queries
                            type: boolean
                          prepare_stmt:
                            default: true
                            description: PrepareStmt enables prepared statements
                            type: boolean
                          skip_err_record_not_found:
                            default: true
                            description: SkipErrRecordNotFound skips "record not found"
                              errors
                            type: boolean
                          slow_threshold:
                            default: 1000
                            description: SlowThreshold is the threshold for slow queries
                              in milliseconds
                            type: integer
                        type: object
                      postgres:
                        description: Postgres configuration
                        properties:
                          conn_max_idle_time_secs:
                            default: 3600
                            description: ConnMaxIdleTimeSecs is the maximum connection
                              idle time in seconds
                            type: integer
                          host:
                            description: Host is the PostgreSQL host
                            type: string
                          max_idle_conns:
                            default: 10
                            description: MaxIdleConns is the maximum number of idle
                              connections
                            type: integer
                          max_open_conns:
                            default: 10
                            description: MaxOpenConns is the maximum number of open
                              connections
                            type: integer
                          name:
                            description: Name is the database name
                            type: string
                          pass:
                            description: Pass is the database password
                            type: string
                          port:
                            description: Port is the PostgreSQL port
                            type: integer
                          ssl:
                            default: false
                            description: SSL indicates whether to use SSL
                            type: boolean
                          user:
                            description: User is the database user
                            type: string
                        type: object
                      sqlite:
                        description: Sqlite configuration
                        properties:
                          path:
                            default: /var/lib/headscale/db.sqlite
                            description: Path is the path to the SQLite database file
                            type: string
                          wal_autocheckpoint:
                            default: 1000
                            description: WALAutocheckpoint sets the WAL autocheckpoint
                              value
                            type: integer
                          write_ahead_log:
                            default: true
                            description: WriteAheadLog enables WAL mode
                            type: boolean
                        type: object
                      type:
                        default: sqlite
                        description: Type is the database type
                        enum:
                        - sqlite
                        - postgres
                        type: string
                    type: object
                  derp:
                    description: DERP configuration
                    properties:
                      auto_update_enabled:
                        default: true
                        description: AutoUpdateEnabled indicates whether to auto-update
                          DERP maps
                        type: boolean
                      paths:
                        description: Paths is the list of local DERP map file paths
                        items:
                          type: string
                        type: array
                      server:
                        description: Server configuration for embedded DERP server
                        properties:
                          automatically_add_embedded_derp_region:
                            default: true
                            description: AutomaticallyAddEmbeddedDerpRegion indicates
                              whether to automatically add the embedded DERP region
                            type: boolean
                          enabled:
                            default: false
                            description: Enabled indicates if the embedded DERP server
                              is enabled
                            type: boolean
                          ipv4:
                            default: 198.51.100.1
                            description: IPv4 is the public IPv4 address
                            type: string
                          ipv6:
                            default: 2001:db8::1
                            description: IPv6 is the public IPv6 address
                            type: string
                          private_key_path:
                            default: /var/lib/headscale/derp_server_private.key
                            description: PrivateKeyPath is the path to the DERP server
                              private key
                            type: string
                          region_code:
                            default: headscale
                            description: RegionCode is the region code for display
                            type: string
                          region_id:
                            default: 999
                            description: RegionID is the region ID for the embedded
                              DERP server
                            type: integer
                          region_name:
                            default: Headscale Embedded DERP
                            description: RegionName is the region name for display
                            type: string
                          stun_listen_addr:
                            default: 0.0.0.0:3478
                            description: STUNListenAddr is the address for STUN connections
                            type: string
                          verify_clients:
                            default: true
                            description: VerifyClients indicates whether to verify
                              clients
                            type: boolean
                        type: object
                      update_frequency:
                        default: 3h
                        description: UpdateFrequency is how often to check for DERP
                          updates
                        type: string
                      urls:
                        default:
                        - https://controlplane.tailscale.com/derpmap/default
                        description: URLs is the list of external DERP map URLs
                        items:
                          type: string
                        type: array
                    type: object
                  disable_check_updates:
                    default: false
                    description: DisableCheckUpdates disables update checks
                    type: boolean
                  dns:
                    description: DNS configuration
                    properties:
                      base_domain:
                        description: BaseDomain is the base domain for MagicDNS
                        type: string
                      extra_records:
                        description: ExtraRecords is the list of extra DNS records
                        items:
                          description: DNSExtraRecord represents an extra DNS record
                          properties:
                            name:
                              description: Name is the DNS record name
                              type: string
                            type:
                              description: Type is the DNS record type
                              enum:
                              - A
                              - AAAA
                              type: string
                            value:
                              description: Value is the DNS record value
                              type: string
                          type: object
                        type: array
                      magic_dns:
                        default: true
                        description: MagicDNS enables MagicDNS
                        type: boolean
                      nameservers:
                        description: Nameservers configuration
                        properties:
                          global:
                            default:
                            - 1.1.1.1
                            - 1.0.0.1
                            - 2606:4700:4700::1111
                            - 2606:4700:4700::1001
                            description: Global nameservers
                            items:
                              type: string
                            type: array
                          split:
                            additionalProperties:
                              items:
                                type: string
                              type: array
                            description: Split DNS configuration
                            type: object
                        type: object
                      override_local_dns:
                        default: true
                        description: OverrideLocalDNS overrides local DNS settings
                        type: boolean
                      search_domains:
                        description: SearchDomains is the list of search domains
                        items:
                          type: string
                        type: array
                    type: object
                  ephemeral_node_inactivity_timeout:
                    default: 30m
                    description: EphemeralNodeInactivityTimeout is the timeout for
                      ephemeral nodes
                    type: string
                  grpc_allow_insecure:
                    default: false
                    description: GRPCAllowInsecure allows insecure gRPC
                    type: boolean
                  grpc_listen_addr:
                    default: 0.0.0.0:50443
                    description: GRPCListenAddr is the address for gRPC
                    type: string
                  listen_addr:
                    default: 0.0.0.0:8080
                    description: ListenAddr is the address to listen on
                    type: string
                  log:
                    description: Log configuration
                    properties:
                      format:
                        default: text
                        description: Format is the log format
                        enum:
