                    description: OIDC configuration
                    properties:
                      allowed_domains:
                        description: AllowedDomains is the list of allowed email domains
                        items:
                          type: string
                        type: array
                      allowed_groups:
                        description: AllowedGroups is the list of allowed groups
                        items:
                          type: string
                        type: array
                      allowed_users:
                        description: AllowedUsers is the list of allowed email addresses
                        items:
                          type: string
                        type: array
                      client_id:
                        description: ClientID is the OIDC client ID
                        type: string
                      client_secret:
                        description: ClientSecret is the OIDC client secret
                        type: string
                      client_secret_path:
                        description: ClientSecretPath is the path to the OIDC client
                          secret file
                        type: string
                      email_verified_required:
                        description: EmailVerifiedRequired requires email verification
                        type: boolean
                      expiry:
                        default: 180d
                        description: Expiry is the authentication expiry duration
                        type: string
                      extra_params:
                        additionalProperties:
                          type: string
                        description: ExtraParams are additional parameters for the
                          OIDC provider
                        type: object
                      issuer:
                        description: Issuer is the OIDC issuer URL
                        type: string
                      only_start_if_oidc_is_available:
                        default: true
                        description: OnlyStartIfOIDCIsAvailable blocks startup until
                          OIDC is available
                        type: boolean
                      pkce:
                        description: PKCE configuration
                        properties:
                          enabled:
                            default: false
                            description: Enabled indicates if PKCE is enabled
                            type: boolean
                          method:
                            default: S256
                            description: Method is the PKCE method
                            enum:
                            - plain
                            - S256
                            type: string
                        type: object
                      scope:
                        description: Scope is the list of OIDC scopes
                        items:
                          type: string
                        type: array
                      use_expiry_from_token:
                        default: false
                        description: UseExpiryFromToken uses the token expiry
                        type: boolean
                    type: object
                  policy:
                    description: Policy configuration
                    properties:
                      mode:
                        default: file
                        description: Mode is the policy mode
                        enum:
                        - file
                        - database
                        type: string
                      path:
                        description: Path is the path to the policy file
                        type: string
                    type: object
                  prefixes:
                    description: Prefixes configuration
                    properties:
                      allocation:
                        default: sequential
                        description: Allocation strategy for IPs
                        enum:
                        - sequential
                        - random
                        type: string
                      v4:
                        default: 100.64.0.0/10
                        description: V4 is the IPv4 prefix for allocation
                        pattern: ^([0-9]{1,3}\.){3}[0-9]{1,3}/[0-9]{1,2}$
                        type: string
                      v6:
                        default: fd7a:115c:a1e0::/48
                        description: V6 is the IPv6 prefix for allocation
                        pattern: ^([0-9a-fA-F]{0,4}:){2,7}([0-9a-fA-F]{0,4})/([0-9]{1,3})$
                        type: string
                    type: object
                  randomize_client_port:
                    default: false
                    description: RandomizeClientPort randomizes the WireGuard client
                      port
                    type: boolean
                  server_url:
                    description: ServerURL is the URL clients will connect to
                    type: string
                  taildrop:
                    description: Taildrop configuration
                    properties:
                      enabled:
                        description: Enabled indicates if Taildrop is enabled
                        type: boolean
                    type: object
                  tls_cert_path:
                    description: TLSCertPath is the path to the TLS certificate
                    type: string
                  tls_key_path:
                    description: TLSKeyPath is the path to the TLS key
                    type: string
                  tls_letsencrypt_cache_dir:
                    default: /var/lib/headscale/cache
                    description: TLSLetsEncryptCacheDir is the cache directory for
                      Let's Encrypt
                    type: string
                  tls_letsencrypt_challenge_type:
                    default: HTTP-01
                    description: TLSLetsEncryptChallengeType is the ACME challenge
                      type
                    enum:
                    - HTTP-01
                    - TLS-ALPN-01
                    type: string
                  tls_letsencrypt_hostname:
                    description: TLSLetsEncryptHostname is the hostname for Let's
                      Encrypt
                    type: string
                  tls_letsencrypt_listen:
                    default: :http
                    description: TLSLetsEncryptListen is the address for Let's Encrypt
                      challenge
                    type: string
                  tuning:
                    description: Tuning configuration
                    properties:
                      batch_change_delay:
                        description: |-
                          BatchChangeDelay controls how long to wait before sending batched updates
                          to clients when multiple changes occur in rapid succession.
                        pattern: ^([0-9]+(\.[0-9]+)?(ns|us|µs|ms|s|m|h))+$
                        type: string
                      batcher_workers:
                        description: |-
                          BatcherWorkers controls the number of parallel workers processing map
                          updates for connected clients.
                        type: integer
                      node_map_session_buffered_chan_size:
                        description: |-
                          NodeMapSessionBufferedChanSize sets the buffer size for the channel that
                          queues map updates to be sent to connected clients.
                        type: integer
                      node_store_batch_size:
                        description: |-
                          NodeStoreBatchSize controls how many write operations are accumulated
                          before rebuilding the in-memory node snapshot.

                          The NodeStore batches write operations (add/update/delete nodes) before
                          rebuilding its in-memory data structures. Rebuilding involves recalculating
                          peer relationships between all nodes based on the current ACL policy, which
                          is computationally expensive and scales with the square of the number of nodes.

                          By batching writes, Headscale can process N operations but only rebuild once,
                          rather than rebuilding N times. This significantly reduces CPU usage during
                          bulk operations like initial sync or policy updates.

                          Trade-off: Higher values reduce CPU usage from rebuilds but increase latency
                          for individual operations waiting for their batch to complete.
                        type: integer
                      node_store_batch_timeout:
                        description: |-
                          NodeStoreBatchTimeout is the maximum time to wait before processing a
                          partial batch of node operations.

                          When NodeStoreBatchSize operations haven't accumulated, this timeout ensures
                          writes don't wait indefinitely. The batch processes when either the size
                          threshold is reached OR this timeout expires, whichever comes first.

                          Trade-off: Lower values provide faster response for individual operations
                          but trigger more frequent (expensive) peer map rebuilds. Higher values
                          optimize for bulk throughput at the cost of individual operation latency.
                        pattern: ^([0-9]+(\.[0-9]+)?(ns|us|µs|ms|s|m|h))+$
                        type: string
                      notifier_send_timeout:
                        description: |-
                          NotifierSendTimeout is the maximum time to wait when sending notifications
                          to connected clients about network changes.
                        pattern: ^([0-9]+(\.[0-9]+)?(ns|us|µs|ms|s|m|h))+$
                        type: string
                      register_cache_cleanup:
                        description: |-
                          RegisterCacheCleanup is the interval between cleanup operations for
                          expired registration cache entries.
                        pattern: ^([0-9]+(\.[0-9]+)?(ns|us|µs|ms|s|m|h))+$
                        type: string
                      register_cache_expiration:
                        description: |-
                          RegisterCacheExpiration is how long registration cache entries remain
                          valid before being eligible for cleanup.
                        pattern: ^([0-9]+(\.[0-9]+)?(ns|us|µs|ms|s|m|h))+$
                        type: string
                    type: object
                  unix_socket:
                    default: /var/run/headscale/headscale.sock
                    description: UnixSocket is the path to the Unix socket
                    minLength: 1
                    type: string
                  unix_socket_permission:
                    default: "0770"
                    description: UnixSocketPermission is the Unix socket permission
                      (e.g., "0770")
                    type: string
                required:
                - server_url
                type: object
              extra_env:
                description: ExtraEnv allows injecting additional environment variables
                  into the Headscale container
                items:
                  description: EnvVar represents an environment variable present in
